name: Refresh D Smart playlist

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours - signed links live ~4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsmart-playlist
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild playlists/dsmart.*
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape free channels and sign their streams
        run: python scripts/dsmart-bot/dsmart_bot.py --out-dir playlists --workers 8

      - name: Commit refreshed playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/dsmart.m3u playlists/dsmart.json
          if git diff --cached --quiet; then
            echo "Playlists unchanged."
            exit 0
          fi
          git commit -m "chore(dsmart): refresh signed channel playlist [skip ci]"
          git push
